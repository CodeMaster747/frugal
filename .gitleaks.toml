# Gitleaks configuration.
#
# CI runs gitleaks against the git history, where this barely matters: the paths
# excluded below are all gitignored and were never committed. It matters for a
# local `gitleaks dir .`, which walks the working tree including build output —
# a scan there reports 14 findings, 13 of them Next.js build artifacts, and a
# scanner that cries wolf thirteen times is one nobody reads.

[extend]
useDefault = true

[allowlist]
description = "Paths and values that are not secrets"

paths = [
  # Next.js writes generated preview and prerender tokens into its build
  # output. They are per-build, local, and gitignored.
  '''frontend/\.next/.*''',
  '''frontend/node_modules/.*''',
  '''node_modules/.*''',
  # Playwright traces and screenshots from failed runs.
  '''frontend/test-results/.*''',
  '''frontend/playwright-report/.*''',
  # .env.example is deliberately NOT allowlisted. It is the one file in the repo
  # that is both committed and shaped exactly like a secrets file, which makes it
  # the easiest place to paste a real value into by mistake — editing it instead
  # of the gitignored .env is a single-keystroke error. Scanning it costs
  # nothing: the placeholder version produces zero findings.
]

regexes = [
  # Angle-bracket placeholders in documentation, e.g. <r2-token-secret>.
  # Narrow on purpose: it matches the placeholder syntax itself, so a real
  # secret pasted into a document is still caught.
  '''<[a-z0-9-]+(key|secret|token|password|id)>''',
]

# The default ruleset scores a bare connection URL as low-entropy and lets it
# through, so a managed-Postgres password — the highest-value secret this repo
# handles — is exactly what it would miss.
[[rules]]
id = "database-url-inline-password"
description = "Database connection string with an embedded password"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb)(?:\+[a-z0-9_]+)?://[^\s:/@]+:[^\s@]+@[^\s/"']+'''
keywords = ["postgres", "postgresql", "mysql", "mariadb", "mongodb"]

  [rules.allowlist]
  description = "Local endpoints, shell interpolation, and documented placeholders"
  regexes = [
    # A credential for a host that only exists on this machine is not a leak.
    # The trailing delimiter is optional because the match above stops at the
    # host — requiring "/" here would let every localhost URL through as a
    # finding instead of allowlisting it.
    '''://[^\s@]+@(localhost|127\.0\.0\.1|host\.docker\.internal|postgres|db)(:\d+)?([/\s]|$)''',
    # Shell and compose interpolation: the value is substituted at run time, so
    # the literal in the file is a variable name, not a credential.
    ''':\$\{?[A-Za-z_][A-Za-z0-9_]*\}?@''',
    # Placeholder passwords used in .env.example and docs/09-deployment.md.
    ''':(pass|PASS|password|PASSWORD|changeme|CHANGEME|xxx|XXX|frugal)@''',
  ]
