# Production stack for the EC2 instance.
#
# Five containers: Caddy, the API, one worker, beat, and Redis. Postgres is
# absent on purpose -- it is on Neon, which is what keeps the instance free of
# anything that cannot be rebuilt by terminating and re-applying.
#
# Redis moved back onto the instance after measuring the alternative. Upstash's
# free tier is 500k commands per *month*; an idle Celery worker BRPOPs its
# queues about once a second, which is ~2.6M -- so the broker stops answering
# roughly a week into any month, and the failure looks like tasks silently not
# running. Co-hosting is affordable because this Redis holds only regenerable
# state (broker, cache, rate-limit counters), so it is capped and unpersisted
# below rather than treated as a database. It also removes the `rediss://`
# handling Celery requires for a TLS broker.
#
# No bind mounts of source, no --reload, no dev toolchain in the images. Run
# with an env file that never enters the repository:
#
#   docker compose -f docker-compose.prod.yml --env-file /opt/frugal/.env up -d

x-backend-env: &backend-env
  ENVIRONMENT: production
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  DATABASE_URL: ${DATABASE_URL:?set in /opt/frugal/.env}
  DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:?Neon pools connections; migrations need the direct endpoint}
  REDIS_URL: ${REDIS_URL:?set in /opt/frugal/.env}
  JWT_SECRET: ${JWT_SECRET:?set in /opt/frugal/.env}
  STORAGE_BACKEND: s3
  S3_BUCKET: ${S3_BUCKET:?from terraform output receipts_bucket}
  S3_REGION: ${AWS_REGION:-ap-south-1}
  # No S3_ACCESS_KEY or S3_SECRET_KEY. boto3 picks up the instance profile's
  # rotating credentials from the metadata service, so there is no long-lived
  # secret on this machine to leak.
  CORS_ORIGINS: ${CORS_ORIGINS:?the public URL serving the frontend}

services:
  # Broker, aggregate cache, and rate-limit counters. Nothing here survives a
  # restart by design, and nothing needs to.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `save ""` disables RDB snapshots. Not just to avoid the disk: BGSAVE
    # forks, and a fork on a 1 GB instance can briefly double Redis' resident
    # size at exactly the moment a Prophet fit is already holding ~450 MB.
    #
    # 64 MB with LRU eviction makes the cap a bounded, self-correcting cost
    # instead of a slow climb into the swap file. Evicting a cached aggregate
    # costs one recomputation; evicting a queued task would lose work, but the
    # queue is only ever a handful of keys at this scale.
    command: >
      redis-server --save "" --appendonly no
      --maxmemory 64mb --maxmemory-policy allkeys-lru
    # Not published to the host. Only the compose network reaches it, which is
    # what makes running without a password acceptable here.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &json_logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing this volume means
      # re-requesting certificates on every restart, which hits Let's Encrypt
      # rate limits after five attempts in a week.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-:80}
    depends_on:
      api: {condition: service_healthy}

  api:
    image: ${IMAGE_REPO:-frugal}/api:${IMAGE_TAG:-latest}
    build:
      context: ../../backend
      dockerfile: ../infra/docker/backend.Dockerfile
      args:
        # No `dev` extra: pytest, ruff, and mypy have no business in a
        # production image, and each one is attack surface plus megabytes.
        INSTALL_EXTRAS: "auth,ocr,classify"
        WITH_OCR: "true"
    restart: unless-stopped
    environment: *backend-env
    # Not published to the host. Only Caddy reaches the API, over the compose
    # network, so there is no way to bypass TLS by hitting port 8000 directly.
    expose:
      - "8000"
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --workers 2 --proxy-headers --forwarded-allow-ips='*'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      redis: {condition: service_healthy}
    logging: *json_logs

  worker:
    image: ${IMAGE_REPO:-frugal}/worker:${IMAGE_TAG:-latest}
    build:
      context: ../../backend
      dockerfile: ../infra/docker/worker.Dockerfile
      args:
        INSTALL_EXTRAS: "auth,ocr,classify,forecast"
    restart: unless-stopped
    environment: *backend-env
    # Concurrency 1, as in development: measured footprint is ~450 MB during a
    # Prophet fit or an OpenCV pipeline, so a second worker on a 1 GB instance
    # is an out-of-memory kill rather than throughput (ADR-006).
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=info --concurrency=1 --max-tasks-per-child=50
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s
    depends_on:
      redis: {condition: service_healthy}
    logging: *json_logs

  beat:
    image: ${IMAGE_REPO:-frugal}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-env
    command: >
      celery -A app.workers.celery_app.celery_app beat --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    depends_on:
      redis: {condition: service_healthy}
    logging: *json_logs

volumes:
  caddy_data:
  caddy_config:
